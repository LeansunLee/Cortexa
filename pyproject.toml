[project]
name = "agentdevstu"
version = "0.1.0"
description = "LangGraph multi-agent exploration project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.11,<2",
    "langchain-core>=1.6.1,<2",
    "langchain-openai>=1.6.0,<2",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.2",
    "pyyaml>=6.0.3",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
]

[project.scripts]
agentdevstu = "agentdevstu.cli:app"
agentdevstu-web = "agentdevstu.web_cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentdevstu"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.5",
    "types-pyyaml>=6.0.12.20260815",
]
