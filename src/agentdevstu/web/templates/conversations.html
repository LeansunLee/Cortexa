{% extends "base.html" %}

{% block title %}对话管理 - AgentDevStu{% endblock %}
{% block page_title %}对话管理{% endblock %}

{% block content %}
<div class="conversations-layout">
  <!-- 对话列表侧边栏 -->
  <div class="conversations-sidebar">
    <div class="sidebar-header">
      <h3>对话列表</h3>
      <button class="btn btn-sm btn-primary" onclick="createConversation()">
        <span>+</span> 新建
      </button>
    </div>
    <div class="conversation-list" id="conversation-list">
      <div class="empty-state">
        <p>暂无对话</p>
      </div>
    </div>
  </div>

  <!-- 对话内容区 -->
  <div class="conversation-main">
    <div class="conversation-header" id="conversation-header" style="display: none;">
      <h3 id="conversation-title">选择一个对话</h3>
      <button class="btn btn-sm btn-ghost" onclick="deleteConversation()">删除</button>
    </div>
    
    <div class="messages-container" id="messages-container">
      <div class="empty-state">
        <div class="icon">💬</div>
        <p>选择或创建一个对话开始交流</p>
      </div>
    </div>
    
    <div class="chat-input-area" id="chat-input-area" style="display: none;">
      <div class="chat-input-row">
        <textarea id="message-input" placeholder="输入消息..." rows="1"></textarea>
        <button class="btn btn-primary" onclick="sendMessage()" id="send-btn">
          发送
        </button>
      </div>
    </div>
  </div>
</div>

<style>
.conversations-layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  height: calc(100vh - 56px);
  margin: -32px;
  margin-top: 0;
}

.conversations-sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}

.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}

.sidebar-header h3 {
  font-size: 16px;
  font-weight: 600;
}

.conversation-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.conversation-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s;
}

.conversation-item:hover {
  background: var(--surface2);
}

.conversation-item.active {
  background: var(--primary);
  color: var(--primary-text);
}

.conversation-item .conv-icon {
  font-size: 20px;
}

.conversation-item .conv-info {
  flex: 1;
  min-width: 0;
}

.conversation-item .conv-title {
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.conversation-item .conv-time {
  font-size: 12px;
  color: var(--text2);
}

.conversation-item.active .conv-time {
  color: rgba(255, 255, 255, 0.7);
}

.conversation-main {
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

.conversation-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.conversation-header h3 {
  font-size: 16px;
  font-weight: 600;
}

.messages-container {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.message {
  display: flex;
  gap: 12px;
  max-width: 80%;
}

.message.user {
  align-self: flex-end;
  flex-direction: row-reverse;
}

.message.assistant {
  align-self: flex-start;
}

.message-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}

.message.user .message-avatar {
  background: var(--primary);
  color: var(--primary-text);
}

.message.assistant .message-avatar {
  background: var(--ai-bg);
  color: var(--ai);
}

.message-content {
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 14px;
  line-height: 1.6;
}

.message.user .message-content {
  background: var(--primary);
  color: var(--primary-text);
}

.message.assistant .message-content {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
}

.chat-input-area {
  padding: 16px 24px;
  background: var(--surface);
  border-top: 1px solid var(--border);
}

.chat-input-row {
  display: flex;
  gap: 12px;
  align-items: flex-end;
}

.chat-input-row textarea {
  flex: 1;
  padding: 12px 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 14px;
  resize: none;
  outline: none;
  min-height: 44px;
  max-height: 160px;
  font-family: inherit;
  line-height: 1.5;
}

.chat-input-row textarea:focus {
  border-color: var(--primary);
}
</style>

{% endblock %}

{% block scripts %}
<script>
let currentWorkspace = null;
let currentConversation = null;
let conversations = [];

window.addEventListener('workspace-changed', (e) => {
  currentWorkspace = e.detail;
  loadConversations();
});

async function loadConversations() {
  if (!currentWorkspace) return;
  
  try {
    const res = await fetch(`/api/workspaces/${currentWorkspace}/conversations`);
    conversations = await res.json();
    renderConversations();
  } catch (e) {
    console.error('Failed to load conversations:', e);
  }
}

function renderConversations() {
  const list = document.getElementById('conversation-list');
  
  if (conversations.length === 0) {
    list.innerHTML = '<div class="empty-state"><p>暂无对话</p></div>';
    return;
  }
  
  list.innerHTML = conversations.map(conv => `
    <div class="conversation-item ${currentConversation === conv.id ? 'active' : ''}" 
         onclick="selectConversation('${conv.id}')">
      <span class="conv-icon">💬</span>
      <div class="conv-info">
        <div class="conv-title">${conv.title || '新对话'}</div>
        <div class="conv-time">${new Date(conv.created_at).toLocaleString('zh-CN')}</div>
      </div>
    </div>
  `).join('');
}

async function createConversation() {
  if (!currentWorkspace) {
    alert('请先选择工作空间');
    return;
  }
  
  try {
    const res = await fetch('/api/conversations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        workspace_id: currentWorkspace,
        title: '新对话'
      })
    });
    
    if (res.ok) {
      const conv = await res.json();
      conversations.unshift(conv);
      renderConversations();
      selectConversation(conv.id);
      showToast('对话创建成功', 'success');
    }
  } catch (e) {
    showToast('网络错误', 'error');
  }
}

async function selectConversation(convId) {
  currentConversation = convId;
  renderConversations();
  
  document.getElementById('conversation-header').style.display = 'flex';
  document.getElementById('chat-input-area').style.display = 'block';
  
  const conv = conversations.find(c => c.id === convId);
  document.getElementById('conversation-title').textContent = conv?.title || '对话';
  
  await loadMessages(convId);
}

async function loadMessages(convId) {
  try {
    const res = await fetch(`/api/conversations/${convId}`);
    const conv = await res.json();
    
    const container = document.getElementById('messages-container');
    
    if (!conv.messages || conv.messages.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="icon">💬</div>
          <p>开始发送消息吧</p>
        </div>
      `;
      return;
    }
    
    container.innerHTML = conv.messages.map(msg => `
      <div class="message ${msg.role}">
        <div class="message-avatar">${msg.role === 'user' ? '👤' : '🤖'}</div>
        <div class="message-content">${escapeHtml(msg.content)}</div>
      </div>
    `).join('');
    
    container.scrollTop = container.scrollHeight;
  } catch (e) {
    console.error('Failed to load messages:', e);
  }
}

async function sendMessage() {
  const input = document.getElementById('message-input');
  const content = input.value.trim();
  
  if (!content || !currentConversation) return;
  
  const sendBtn = document.getElementById('send-btn');
  sendBtn.disabled = true;
  input.value = '';
  
  // 本地立即显示
  appendMessage('user', content);
  
  try {
    const res = await fetch(`/api/conversations/${currentConversation}/messages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content })
    });
    
    if (res.ok) {
      const data = await res.json();
      if (data.reply) {
        appendMessage('assistant', data.reply);
      }
    }
  } catch (e) {
    appendMessage('assistant', '❌ 发送失败，请重试');
  }
  
  sendBtn.disabled = false;
  input.focus();
}

function appendMessage(role, content) {
  const container = document.getElementById('messages-container');
  const emptyState = container.querySelector('.empty-state');
  if (emptyState) emptyState.remove();
  
  const msgDiv = document.createElement('div');
  msgDiv.className = `message ${role}`;
  msgDiv.innerHTML = `
    <div class="message-avatar">${role === 'user' ? '👤' : '🤖'}</div>
    <div class="message-content">${escapeHtml(content)}</div>
  `;
  container.appendChild(msgDiv);
  container.scrollTop = container.scrollHeight;
}

async function deleteConversation() {
  if (!currentConversation) return;
  
  if (!confirm('确定要删除这个对话吗？')) return;
  
  try {
    const res = await fetch(`/api/conversations/${currentConversation}`, {
      method: 'DELETE'
    });
    
    if (res.ok) {
      conversations = conversations.filter(c => c.id !== currentConversation);
      currentConversation = null;
      renderConversations();
      
      document.getElementById('conversation-header').style.display = 'none';
      document.getElementById('chat-input-area').style.display = 'none';
      document.getElementById('messages-container').innerHTML = `
        <div class="empty-state">
          <div class="icon">💬</div>
          <p>选择或创建一个对话开始交流</p>
        </div>
      `;
      
      showToast('对话已删除', 'success');
    }
  } catch (e) {
    showToast('删除失败', 'error');
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function showToast(message, type) {
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// Enter 发送消息
document.getElementById('message-input')?.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

loadConversations();
</script>
{% endblock %}
