{% extends "base.html" %}
{% block title %}任务 - AgentDevStu{% endblock %}
{% block page_title %}任务管理{% endblock %}

{% block content %}
<div class="page-header">
  <div></div>
  <button class="btn btn-primary" onclick="showCreateModal()">+ 创建任务</button>
</div>

<div class="card">
  <div id="task-list">
    <div class="empty-state" style="height:200px"><p>加载中...</p></div>
  </div>
</div>

<div id="modal-overlay" style="display:none">
  <div class="modal-box">
    <div class="modal-header">
      <h3>创建任务</h3>
      <button class="btn btn-ghost btn-sm" onclick="hideModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>名称 *</label>
        <input type="text" id="create-name" placeholder="如：设计新能源汽车APP">
      </div>
      <div class="form-group">
        <label>描述</label>
        <textarea id="create-desc" rows="2" placeholder="任务描述"></textarea>
      </div>
      <div class="form-group">
        <label>关联工作流</label>
        <select id="create-workflow"><option value="">-- 不关联 --</option></select>
      </div>
      <div class="form-group">
        <label>输入数据 (JSON)</label>
        <textarea id="create-input" rows="3" placeholder='{"requirement": "..."}'></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="hideModal()">取消</button>
      <button class="btn btn-primary" id="create-btn" onclick="createTask()">创建</button>
    </div>
  </div>
</div>

<div id="run-detail-overlay" style="display:none"></div>
{% endblock %}

{% block scripts %}
<script>
let workflows = [];

async function loadTasks() {
  if (!currentWorkspace) return;
  const container = document.getElementById('task-list');
  try {
    const [tasksRes, wfRes] = await Promise.all([
      fetch(`/api/workspaces/${currentWorkspace}/tasks`),
      fetch(`/api/workspaces/${currentWorkspace}/workflows`).then(r => r.json())
    ]);
    workflows = wfRes;
    const tasks = await tasksRes.json();

    if (tasks.length === 0) {
      container.innerHTML = '<div class="empty-state" style="height:200px"><div class="icon">📋</div><p>还没有任务</p></div>';
      return;
    }
    container.innerHTML = `<table class="data-table">
      <thead><tr><th>名称</th><th>状态</th><th>工作流</th><th>输入</th><th>创建时间</th><th>操作</th></tr></thead>
      <tbody>${tasks.map(t => {
        const wf = workflows.find(w => w.id === t.workflow_id);
        return `<tr>
          <td style="font-weight:600">${t.name}</td>
          <td><span class="badge badge-${t.status}">${t.status}</span></td>
          <td>${wf ? wf.name : '-'}</td>
          <td style="color:var(--text2);font-size:13px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${JSON.stringify(t.input_data || {})}</td>
          <td>${new Date(t.created_at).toLocaleString('zh-CN')}</td>
          <td style="display:flex;gap:6px">
            <button class="btn btn-success btn-sm" onclick="runTask('${t.id}')">运行</button>
            <button class="btn btn-ghost btn-sm" onclick="viewRuns('${t.id}')">运行记录</button>
            <button class="btn btn-danger btn-sm" onclick="deleteTask('${t.id}')">删除</button>
          </td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;
  } catch (e) {
    container.innerHTML = '<div class="empty-state" style="height:200px"><p>加载失败</p></div>';
  }
}

function showCreateModal() {
  document.getElementById('modal-overlay').style.display = 'flex';
  const sel = document.getElementById('create-workflow');
  sel.innerHTML = '<option value="">-- 不关联 --</option>' + workflows.map(w => `<option value="${w.id}">${w.name}</option>`).join('');
  document.getElementById('create-name').value = '';
  document.getElementById('create-desc').value = '';
  document.getElementById('create-input').value = '';
  document.getElementById('create-name').focus();
}

function hideModal() { document.getElementById('modal-overlay').style.display = 'none'; }

async function createTask() {
  const name = document.getElementById('create-name').value.trim();
  if (!name) { alert('请输入名称'); return; }
  let inputData = {};
  const raw = document.getElementById('create-input').value.trim();
  if (raw) { try { inputData = JSON.parse(raw); } catch(e) { alert('JSON 格式错误'); return; } }
  const wfId = document.getElementById('create-workflow').value || null;
  try {
    const res = await fetch(`/api/tasks`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        workspace_id: currentWorkspace,
        name,
        description: document.getElementById('create-desc').value || null,
        workflow_id: wfId,
        input_data: inputData,
      })
    });
    if (res.ok) { hideModal(); loadTasks(); showToast('创建成功', 'success'); }
    else { const err = await res.json(); showToast('创建失败: ' + err.detail, 'error'); }
  } catch (e) { showToast('网络错误', 'error'); }
}

async function runTask(taskId) {
  if (!confirm('运行此任务？')) return;
  try {
    const res = await fetch(`/api/tasks/${taskId}/run`, { method: 'POST' });
    if (res.ok) {
      showToast('任务已开始运行', 'success');
      setTimeout(loadTasks, 2000);
    } else {
      const err = await res.json();
      showToast('运行失败: ' + (err.detail || ''), 'error');
    }
  } catch (e) { showToast('网络错误', 'error'); }
}

async function viewRuns(taskId) {
  try {
    const res = await fetch(`/api/tasks/${taskId}/runs`);
    const runs = await res.json();
    const overlay = document.getElementById('run-detail-overlay');
    overlay.innerHTML = `
      <div class="modal-overlay-bg" onclick="document.getElementById('run-detail-overlay').style.display='none'" style="position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;display:flex;align-items:center;justify-content:center">
        <div class="modal-box" style="max-width:700px;width:90%;max-height:80vh;overflow-y:auto" onclick="event.stopPropagation()">
          <div class="modal-header">
            <h3>运行记录</h3>
            <button class="btn btn-ghost btn-sm" onclick="document.getElementById('run-detail-overlay').style.display='none'">✕</button>
          </div>
          <div class="modal-body">
            ${runs.length === 0 ? '<p style="color:var(--text2)">暂无运行记录</p>' :
            runs.map(r => `<div class="card" style="margin-bottom:12px">
              <div style="display:flex;justify-content:space-between;margin-bottom:8px">
                <span style="font-weight:600">Run #${r.run_number}</span>
                <span class="badge badge-${r.status}">${r.status}</span>
              </div>
              <div style="font-size:13px;color:var(--text2)">
                <div>开始: ${new Date(r.started_at).toLocaleString('zh-CN')}</div>
                ${r.completed_at ? `<div>完成: ${new Date(r.completed_at).toLocaleString('zh-CN')}</div>` : ''}
                ${r.error_message ? `<div style="color:var(--danger)">错误: ${r.error_message}</div>` : ''}
              </div>
              ${r.context ? `<pre style="background:var(--surface2);padding:12px;border-radius:8px;font-size:12px;margin-top:8px;max-height:200px;overflow-y:auto">${JSON.stringify(r.context, null, 2)}</pre>` : ''}
            </div>`).join('')}
          </div>
        </div>
      </div>`;
    overlay.style.display = 'block';
  } catch (e) { showToast('加载失败', 'error'); }
}

async function deleteTask(id) {
  if (!confirm('确定删除？')) return;
  try { await fetch(`/api/tasks/${id}`, { method: 'DELETE' }); loadTasks(); showToast('已删除', 'success'); }
  catch (e) { showToast('删除失败', 'error'); }
}

function showToast(msg, type) { const t=document.createElement('div');t.className=`toast toast-${type}`;t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000); }

window.addEventListener('workspace-changed', loadTasks);
document.addEventListener('DOMContentLoaded', () => setTimeout(loadTasks, 500));
</script>
{% endblock %}
