<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cortexa - 配置</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="nav">
    <span class="nav-brand">🤖 Cortexa</span>
    <div class="nav-links">
      <a href="/" class="active">⚙️ 配置</a>
      <a href="/chat">💬 对话</a>
    </div>
  </nav>

  <div class="page">
    <h1>LLM 供应商配置</h1>
    <p class="subtitle">管理 API Key、切换供应商、调整模型参数</p>

    <!-- Default provider selector -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">当前默认供应商</span>
        <span id="default-badge" class="badge badge-active"></span>
      </div>
      <div style="display:flex;gap:12px;align-items:center">
        <select id="default-select" style="flex:1;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;">
        </select>
        <button class="btn btn-primary" onclick="saveDefault()">保存</button>
      </div>
    </div>

    <!-- Provider list -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">供应商列表</span>
        <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ 添加供应商</button>
      </div>
      <div id="provider-list" class="provider-list"></div>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:none;align-items:center;justify-content:center;">
    <div class="card" style="width:520px;max-height:90vh;overflow-y:auto;">
      <div class="card-header">
        <span class="card-title" id="modal-title">添加供应商</span>
        <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
      </div>
      <form id="provider-form" onsubmit="return saveProvider(event)">
        <input type="hidden" id="edit-name" value="">
        <div class="form-row">
          <div class="form-group">
            <label>名称</label>
            <input id="f-name" required placeholder="my-provider">
          </div>
          <div class="form-group">
            <label>类型</label>
            <select id="f-kind">
              <option value="openai">OpenAI 兼容</option>
              <option value="anthropic">Anthropic</option>
              <option value="ollama">Ollama (本地)</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>模型</label>
          <input id="f-model" required placeholder="deepseek-chat">
        </div>
        <div class="form-group">
          <label>Base URL（OpenAI 兼容必填）</label>
          <input id="f-base-url" placeholder="https://api.deepseek.com/v1">
        </div>
        <div class="form-group">
          <label>API Key</label>
          <input id="f-api-key" type="password" placeholder="sk-...">
        </div>
        <div class="form-row-3">
          <div class="form-group">
            <label>Temperature</label>
            <input id="f-temp" type="number" step="0.1" min="0" max="2" value="0.2">
          </div>
          <div class="form-group">
            <label>Max Tokens</label>
            <input id="f-max-tokens" type="number" min="256" max="128000" value="4096">
          </div>
          <div class="form-group" style="display:flex;align-items:flex-end">
            <button type="submit" class="btn btn-primary" style="width:100%">保存</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div id="toast"></div>

  <script src="/static/js/config.js"></script>
</body>
</html>
