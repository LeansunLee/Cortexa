{% extends "base.html" %}

{% block title %}工作流管理 - Cortexa{% endblock %}
{% block page_title %}工作流管理{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <p class="subtitle">设计和管理多智能体协作工作流</p>
  </div>
  <button class="btn btn-primary" onclick="showCreateModal()">
    <span>+</span> 创建工作流
  </button>
</div>

<div class="card">
  <table class="data-table">
    <thead>
      <tr>
        <th>名称</th>
        <th>描述</th>
        <th>节点数</th>
        <th>状态</th>
        <th>创建时间</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="workflows-table">
      <tr>
        <td colspan="6" class="empty-state">暂无工作流</td>
      </tr>
    </tbody>
  </table>
</div>

<!-- 创建工作流模态框 -->
<div id="create-modal" class="modal" style="display: none;">
  <div class="modal-content">
    <div class="modal-header">
      <h3>创建工作流</h3>
      <button class="btn-close" onclick="hideCreateModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>名称</label>
        <input type="text" id="workflow-name" placeholder="输入工作流名称">
      </div>
      <div class="form-group">
        <label>描述</label>
        <textarea id="workflow-description" rows="3" placeholder="输入工作流描述"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="hideCreateModal()">取消</button>
      <button class="btn btn-primary" onclick="createWorkflow()">创建</button>
    </div>
  </div>
</div>

<style>
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal-content {
  background: var(--surface);
  border-radius: var(--radius);
  width: 90%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
}

.modal-header h3 {
  font-size: 18px;
  font-weight: 600;
}

.btn-close {
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: var(--text2);
}

.modal-body {
  padding: 24px;
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  padding: 16px 24px;
  border-top: 1px solid var(--border);
}
</style>

{% endblock %}

{% block scripts %}
<script>
let currentWorkspace = null;

window.addEventListener('workspace-changed', (e) => {
  currentWorkspace = e.detail;
  loadWorkflows();
});

function showCreateModal() {
  document.getElementById('create-modal').style.display = 'flex';
}

function hideCreateModal() {
  document.getElementById('create-modal').style.display = 'none';
}

async function loadWorkflows() {
  if (!currentWorkspace) return;
  
  try {
    const res = await fetch(`/api/workspaces/${currentWorkspace}/workflows`);
    const workflows = await res.json();
    const tbody = document.getElementById('workflows-table');
    
    if (workflows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-state">暂无工作流</td></tr>';
      return;
    }
    
    tbody.innerHTML = workflows.map(wf => `
      <tr>
        <td><strong>${wf.name}</strong></td>
        <td>${wf.description || '-'}</td>
        <td>${wf.nodes_count || 0}</td>
        <td>
          <span class="status-badge status-${wf.status}">${wf.status === 'published' ? '已发布' : '草稿'}</span>
        </td>
        <td>${new Date(wf.created_at).toLocaleString('zh-CN')}</td>
        <td>
          <a href="/workflows/${wf.id}" class="btn btn-sm btn-ghost">详情</a>
        </td>
      </tr>
    `).join('');
  } catch (e) {
    console.error('Failed to load workflows:', e);
  }
}

async function createWorkflow() {
  if (!currentWorkspace) {
    alert('请先选择工作空间');
    return;
  }
  
  const name = document.getElementById('workflow-name').value.trim();
  const description = document.getElementById('workflow-description').value.trim();
  
  if (!name) {
    alert('请输入名称');
    return;
  }
  
  try {
    const res = await fetch(`/api/workspaces/${currentWorkspace}/workflows`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, description })
    });
    
    if (res.ok) {
      hideCreateModal();
      loadWorkflows();
      showToast('工作流创建成功', 'success');
    } else {
      const error = await res.json();
      showToast(error.detail || '创建失败', 'error');
    }
  } catch (e) {
    showToast('网络错误', 'error');
  }
}

function showToast(message, type) {
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

loadWorkflows();
</script>
{% endblock %}
